spring:
  application:
    name: resilience-reactive-example
  threads:
    virtual:
      enabled: false
  reactor:
    context-propagation: auto
  r2dbc:
    url: r2dbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:catalog}
    username: ${DB_USER:catalog}
    password: ${DB_PASSWORD:catalog}
    pool:
      enabled: true
      initial-size: 10
      max-size: 40
      max-idle-time: 30s
      max-acquire-time: 2s
      max-create-connection-time: 2s
      validation-query: SELECT 1
  flyway:
    enabled: true
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:catalog}
    user: ${DB_USER:catalog}
    password: ${DB_PASSWORD:catalog}
    locations: classpath:db/migration
    baseline-on-migrate: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 200ms
      connect-timeout: 200ms
      client-type: lettuce
      lettuce:
        shutdown-timeout: 100ms

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  netty:
    connection-timeout: 2s
    idle-timeout: 60s

catalog:
  metrics:
    percentiles-histogram: true
  schedulers:
    integration-parallelism: ${INTEGRATION_PARALLELISM:0}
    integration-queue-capacity: 1000
    persistence-parallelism: ${PERSISTENCE_PARALLELISM:0}
    enrichment-parallelism: ${ENRICHMENT_PARALLELISM:0}
  data-access:
    read-timeout: 1500ms
    write-timeout: 2500ms
    list-timeout: 3s
    max-page-size: 100
  cache:
    enabled: true
    remote-ttl: 5m
    remote-timeout: 150ms
    write-timeout: 200ms
    local-enabled: true
    local-ttl: 15s
    local-max-size: 10000
    key-prefix: catalog
  integrations:
    endpoints:
      pricing-service:
        base-url: ${PRICING_BASE_URL:http://localhost:8081}
        connect-timeout: 200ms
        response-timeout: 900ms
        call-timeout: 800ms
        max-connections: 50
        pending-acquire-timeout: 300ms
        fail-fast-on-open-circuit: true
      inventory-service:
        base-url: ${INVENTORY_BASE_URL:http://localhost:8081}
        connect-timeout: 200ms
        response-timeout: 700ms
        call-timeout: 600ms
        max-connections: 60
        pending-acquire-timeout: 300ms
        fail-fast-on-open-circuit: true
      rating-service:
        base-url: ${RATING_BASE_URL:http://localhost:8081}
        connect-timeout: 150ms
        response-timeout: 500ms
        call-timeout: 400ms
        max-connections: 30
        pending-acquire-timeout: 200ms
        fail-fast-on-open-circuit: true

resilience4j:
  circuitbreaker:
    configs:
      default:
        register-health-indicator: true
        sliding-window-type: COUNT_BASED
        sliding-window-size: 20
        minimum-number-of-calls: 10
        failure-rate-threshold: 50
        slow-call-rate-threshold: 60
        slow-call-duration-threshold: 700ms
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 5
        automatic-transition-from-open-to-half-open-enabled: true
        record-exceptions:
          - java.io.IOException
          - java.util.concurrent.TimeoutException
          - org.springframework.web.reactive.function.client.WebClientRequestException
          - org.springframework.web.reactive.function.client.WebClientResponseException
          - org.springframework.dao.DataAccessResourceFailureException
          - com.clau.resiliencereactiveexample.infrastructure.persistence.DataStoreUnavailableException
          - com.clau.resiliencereactiveexample.infrastructure.cache.CacheUnavailableException
        ignore-exceptions:
          - com.clau.resiliencereactiveexample.infrastructure.http.DownstreamClientException
          - com.clau.resiliencereactiveexample.application.ProductNotFoundException
          - com.clau.resiliencereactiveexample.infrastructure.persistence.DuplicatedSkuException
      cache:
        base-config: default
        sliding-window-size: 30
        minimum-number-of-calls: 10
        failure-rate-threshold: 40
        slow-call-duration-threshold: 150ms
        wait-duration-in-open-state: 5s
        permitted-number-of-calls-in-half-open-state: 3
    instances:
      pricing-service:
        base-config: default
        slow-call-duration-threshold: 800ms
      inventory-service:
        base-config: default
        slow-call-duration-threshold: 600ms
      rating-service:
        base-config: default
        failure-rate-threshold: 60
        slow-call-duration-threshold: 400ms
      product-database-read:
        base-config: default
        sliding-window-size: 50
        minimum-number-of-calls: 20
        slow-call-duration-threshold: 1500ms
        wait-duration-in-open-state: 5s
      product-database-write:
        base-config: default
        sliding-window-size: 20
        slow-call-duration-threshold: 2500ms
      product-cache:
        base-config: cache

  ratelimiter:
    configs:
      default:
        register-health-indicator: false
        limit-refresh-period: 1s
        timeout-duration: 0
        subscribe-for-events: true
    instances:
      pricing-service:
        base-config: default
        limit-for-period: 200
      inventory-service:
        base-config: default
        limit-for-period: 300
      rating-service:
        base-config: default
        limit-for-period: 150
      product-database-read:
        base-config: default
        limit-for-period: 1000
      product-database-write:
        base-config: default
        limit-for-period: 100
      product-cache:
        base-config: default
        limit-for-period: 5000

  bulkhead:
    configs:
      default:
        max-wait-duration: 0
    instances:
      pricing-service:
        max-concurrent-calls: 30
        max-wait-duration: 0
      inventory-service:
        max-concurrent-calls: 40
        max-wait-duration: 0
      rating-service:
        max-concurrent-calls: 20
        max-wait-duration: 0
      product-database-read:
        max-concurrent-calls: 60
        max-wait-duration: 50ms
      product-database-write:
        max-concurrent-calls: 20
        max-wait-duration: 100ms
      product-cache:
        max-concurrent-calls: 100
        max-wait-duration: 0

  timelimiter:
    configs:
      default:
        cancel-running-future: true
    instances:
      pricing-service:
        timeout-duration: 800ms
        cancel-running-future: true
      inventory-service:
        timeout-duration: 600ms
        cancel-running-future: true
      rating-service:
        timeout-duration: 400ms
        cancel-running-future: true
      product-database-read:
        timeout-duration: 1500ms
        cancel-running-future: true
      product-database-write:
        timeout-duration: 2500ms
        cancel-running-future: true
      product-cache:
        timeout-duration: 150ms
        cancel-running-future: true

  retry:
    configs:
      default:
        max-attempts: 3
        wait-duration: 50ms
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
        exponential-max-wait-duration: 2s
        enable-randomized-wait: true
        randomized-wait-factor: 0.5
        retry-exceptions:
          - java.io.IOException
          - java.util.concurrent.TimeoutException
          - org.springframework.web.reactive.function.client.WebClientRequestException
          - org.springframework.web.reactive.function.client.WebClientResponseException
          - org.springframework.dao.DataAccessResourceFailureException
        ignore-exceptions:
          - com.clau.resiliencereactiveexample.infrastructure.http.DownstreamClientException
          - com.clau.resiliencereactiveexample.application.ProductNotFoundException
          - com.clau.resiliencereactiveexample.infrastructure.persistence.DuplicatedSkuException
          - io.github.resilience4j.circuitbreaker.CallNotPermittedException
          - io.github.resilience4j.ratelimiter.RequestNotPermitted
          - io.github.resilience4j.bulkhead.BulkheadFullException
    instances:
      pricing-service:
        base-config: default
        max-attempts: 3
      inventory-service:
        base-config: default
        max-attempts: 3
      rating-service:
        base-config: default
        max-attempts: 2
        wait-duration: 30ms
      product-database-read:
        base-config: default
        max-attempts: 2
        wait-duration: 100ms
      product-database-write:
        base-config: default
        max-attempts: 1
      product-cache:
        base-config: default
        max-attempts: 1

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,circuitbreakers,circuitbreakerevents,ratelimiters,bulkheads,retries,env,configprops
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  health:
    circuitbreakers:
      enabled: true
    redis:
      enabled: false
  observations:
    key-values:
      service: ${spring.application.name}
  tracing:
    enabled: true
    sampling:
      probability: 1.0
    baggage:
      enabled: true
      remote-fields:
        - requestId
        - correlationId
        - transactionId
      correlation:
        enabled: true
        fields:
          - requestId
          - correlationId
          - transactionId
  prometheus:
    metrics:
      export:
        enabled: true
  otlp:
    metrics:
      export:
        enabled: false
    tracing:
      export:
        enabled: false

logging:
  level:
    root: INFO
    com.clau.resiliencereactiveexample: DEBUG
    io.github.resilience4j: INFO
    org.springframework.r2dbc: INFO
    reactor.netty.http.client: INFO
