global:
  scrape_interval: 5s
  evaluation_interval: 10s
  external_labels:
    environment: local

scrape_configs:
  - job_name: resilience-reactive-example
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["app:8080"]
        labels:
          service: resilience-reactive-example

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
