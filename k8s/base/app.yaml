apiVersion: v1
kind: ConfigMap
metadata:
  name: catalog-app-config
data:
  SERVER_PORT: "8080"
  DB_HOST: postgres
  DB_PORT: "5432"
  DB_NAME: catalog
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  PRICING_BASE_URL: http://wiremock:8080
  INVENTORY_BASE_URL: http://wiremock:8080
  RATING_BASE_URL: http://wiremock:8080
  SPRING_PROFILES_ACTIVE: json
  JAVA_OPTS: "-XX:MaxRAMPercentage=70 -Dreactor.netty.ioWorkerCount=4"
  INTEGRATION_PARALLELISM: "32"
  PERSISTENCE_PARALLELISM: "16"
  ENRICHMENT_PARALLELISM: "4"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalog-app
  labels:
    app.kubernetes.io/name: catalog-app
spec:
  replicas: 2
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: catalog-app
  template:
    metadata:
      labels:
        app.kubernetes.io/name: catalog-app
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: /actuator/prometheus
        prometheus.io/port: "8080"
    spec:
      terminationGracePeriodSeconds: 40
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: catalog-app
      containers:
        - name: app
          image: catalog/resilience-reactive-example:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: catalog-app-config
          env:
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: catalog-database
                  key: POSTGRES_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: catalog-database
                  key: POSTGRES_PASSWORD
          startupProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 24
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 5
          lifecycle:
            preStop:
              exec:
                command: ["sh", "-c", "sleep 10"]
          resources:
            requests:
              cpu: 300m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: catalog-app
  labels:
    app.kubernetes.io/name: catalog-app
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: catalog-app
  ports:
    - name: http
      port: 8080
      targetPort: http
      nodePort: 30080
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: catalog-app
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: catalog-app
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: catalog-app
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: catalog-app
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 120
