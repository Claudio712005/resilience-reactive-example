apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: catalog

resources:
  - namespace.yaml
  - postgres.yaml
  - redis.yaml
  - wiremock.yaml
  - app.yaml
  - prometheus.yaml
  - grafana.yaml

labels:
  - includeSelectors: false
    pairs:
      app.kubernetes.io/part-of: resilience-reactive-example
